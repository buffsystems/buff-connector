name: files
version: 1.0.3
host_api: 5
publisher: buff
summary: >-
  Файлы на диске — локальные папки и сетевые папки SMB — как контекст для ответов:
  документы Word, таблицы Excel, презентации PowerPoint (2007+ и 97–2003), PDF и
  текстовые файлы. Инструменты — те же glob, grep и read, что у ИИ-агентов для кода; только чтение.
  Ничего не индексируется: файлы читаются в момент вопроса. Интеграция работает от
  имени отдельного пользователя системы — локальные файлы должны быть ему доступны на чтение.
platforms: [linux-x86_64, linux-aarch64]
entry: main.py
webhook: none
credentials:
  # Сетевая папка говорит по SMB, а не по HTTP, и коннектор не может подставить
  # пароль за плагин: учётную запись и пароль плагин получает сам, по своему
  # каналу, только для серверов из корней. Нужна лишь при сетевых корнях;
  # заведите отдельную учётную запись только на чтение.
  - name: share
    kinds: [password]
network:
  - protocol: smb
    hosts_from: roots
    ports: [445]
config_schema:
  type: object
  properties:
    roots:
      type: array
      title: Папки
      description: >-
        Локальные пути (/srv/docs) и сетевые папки (\\сервер\папка\раздел или
        smb://сервер/папка/раздел); бот работает в них и во всём, что вложено.
        Пусто — весь диск машины с коннектором; сетевая папка доступна, только если
        она указана здесь, потому что к ней ходят с паролем.
      items:
        type: string
    excludes:
      type: array
      title: Исключения
      description: >-
        Шаблоны имён и путей, которые бот не видит: *.bak, ~$*, .git,
        archive/2019. Сравниваются с именем файла или папки на любой глубине и с
        путём от указанной папки.
      items:
        type: string
tools:
  - name: glob
    read_only: true
    summary: Найти файлы по имени — шаблон вида *.docx или **/договор*, во всех указанных папках или в одной; новые сначала
  - name: grep
    read_only: true
    summary: Найти по содержимому — регулярное выражение по тексту документов, таблиц, презентаций, PDF и текстовых файлов; файл, номер строки, строка
  - name: read
    read_only: true
    summary: Прочитать файл текстом (документ — markdown, таблица — листами, презентация — слайдами, PDF — постранично) или папку списком; целиком, страницами — по offset/limit

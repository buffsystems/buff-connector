name: redmine
version: 1.1.2
host_api: 1
publisher: buff
summary: Redmine — вопросы и ответы прямо в задачах трекера
platforms: [linux-x86_64, linux-aarch64]
entry: main.py
credentials:
  # Redmine accepts its key ONLY in a header of its own — not as a bearer token.
  - name: api
    kinds: [header]
    header: X-Redmine-API-Key
egress:
  - from_config: base_url
    methods: [GET, POST, PUT]
    path_prefixes: ["/issues", "/projects", "/users", "/search", "/uploads"]
config_schema:
  type: object
  required: [base_url, projects]
  properties:
    base_url:
      type: string
      format: uri
      title: Адрес Redmine
      description: Корень сервера, например https://redmine.corp.local
    projects:
      type: array
      title: Проекты
      description: >-
        Идентификаторы проектов, в которых бот отвечает на обращения — и только
        в них он пишет. Это то, что стоит в адресе проекта, например catalog.
      items:
        type: string
        pattern: "^[A-Za-z0-9_-]+$"
    text_formatting:
      type: string
      title: Разметка текста
      description: >-
        Как ваш Redmine оформляет текст — «Администрирование → Настройки → Общие →
        Форматирование текста». markdown — Markdown и CommonMark (так у Redmine 5 и
        новее из коробки), textile — Textile. Бот пишет ответ и ссылку в той же разметке.
      enum: [markdown, textile]
      default: markdown
    mention_alias:
      type: string
      title: Как ещё к боту обращаются
      description: Дополнительное имя помимо учётной записи, например buff
    accept_assignment:
      type: boolean
      title: Принимать задачи, назначенные боту
      description: >-
        По умолчанию бот берётся за работу только по прямому обращению —
        упоминанию или команде в комментарии. Назначение задачи на его учётную
        запись тоже адресовано ему, но случается и по правилам маршрутизации,
        когда работу заказать никто не хотел. Включайте, если назначение у вас
        делает человек осознанно.
tools:
  - name: search_issues
    read_only: true
    summary: Найти задачи по тексту — когда упомянут номер или нужен контекст из трекера
  - name: get_issue
    read_only: true
    summary: Прочитать задачу с обсуждением — когда нужны требования или ход обсуждения
  - name: add_comment
    read_only: false
    summary: Написать комментарий в задачу
